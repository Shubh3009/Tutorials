<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>🎓 Study Progress Tracker</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
    min-height: 100vh; color: #eee; padding: 20px;
  }
  .container { max-width: 1300px; margin: 0 auto; }
  header {
    text-align: center; margin-bottom: 30px;
    background: rgba(255,255,255,0.08); padding: 25px; border-radius: 16px;
    backdrop-filter: blur(10px);
  }
  h1 { font-size: 2.2em; margin-bottom: 8px; }
  .subtitle { opacity: 0.85; font-size: 0.95em; }
  .stats-row {
    display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 25px;
  }
  @media (max-width: 800px) { .stats-row { grid-template-columns: 1fr; } }
  .card {
    background: rgba(255,255,255,0.1); padding: 20px; border-radius: 14px;
    backdrop-filter: blur(10px); box-shadow: 0 4px 20px rgba(0,0,0,0.2);
  }
  .stats { display: flex; justify-content: space-around; flex-wrap: wrap; gap: 15px; }
  .stat { text-align: center; }
  .stat .big { font-size: 2.4em; font-weight: bold; color: #4ade80; }
  .stat .label { font-size: 0.85em; opacity: 0.8; margin-top: 4px; }
  .overall-bar-wrap {
    margin-top: 15px; background: rgba(0,0,0,0.3); border-radius: 10px;
    height: 22px; overflow: hidden; position: relative;
  }
  .overall-bar {
    height: 100%; background: linear-gradient(90deg, #4ade80, #22c55e);
    width: 0%; transition: width 0.4s ease; border-radius: 10px;
  }
  .overall-bar-text {
    position: absolute; inset: 0; display: flex; align-items: center;
    justify-content: center; font-weight: 600; font-size: 0.9em;
    text-shadow: 0 1px 3px rgba(0,0,0,0.7);
  }
  .chart-wrap { position: relative; height: 260px; }

  .course {
    background: rgba(255,255,255,0.08); border-radius: 14px;
    margin-bottom: 18px; overflow: hidden; backdrop-filter: blur(10px);
  }
  .course-head {
    padding: 15px 20px; display: flex; justify-content: space-between;
    align-items: center; cursor: pointer; user-select: none;
    background: rgba(255,255,255,0.05); transition: background 0.2s;
  }
  .course-head:hover { background: rgba(255,255,255,0.12); }
  .course-title { font-size: 1.15em; font-weight: 600; }
  .course-meta { display: flex; align-items: center; gap: 15px; }
  .mini-bar {
    width: 140px; height: 10px; background: rgba(0,0,0,0.3);
    border-radius: 5px; overflow: hidden;
  }
  .mini-bar-fill {
    height: 100%; background: linear-gradient(90deg, #4ade80, #22c55e);
    transition: width 0.4s;
  }
  .course-pct { font-weight: 600; min-width: 45px; text-align: right; }

  .topics {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 8px; padding: 15px 20px 20px;
  }
  .cell {
    background: rgba(255,255,255,0.06); padding: 10px 12px; border-radius: 8px;
    cursor: pointer; display: flex; align-items: center; gap: 10px;
    border: 2px solid transparent; transition: all 0.2s;
    font-size: 0.9em;
  }
  .cell:hover { background: rgba(255,255,255,0.14); transform: translateY(-2px); }
  .cell.done {
    background: linear-gradient(135deg, #16a34a, #22c55e);
    border-color: #4ade80; color: white; font-weight: 600;
  }
  .cell.done .check { background: white; color: #16a34a; }
  .check {
    width: 22px; height: 22px; border-radius: 50%;
    background: rgba(0,0,0,0.3); display: flex; align-items: center;
    justify-content: center; font-size: 0.85em; flex-shrink: 0;
  }
  .topic-name { flex: 1; }

  .actions {
    display: flex; gap: 10px; justify-content: center;
    margin-top: 25px; flex-wrap: wrap;
  }
  button {
    padding: 10px 18px; border: none; border-radius: 8px;
    background: rgba(255,255,255,0.15); color: white; cursor: pointer;
    font-size: 0.9em; transition: background 0.2s;
  }
  button:hover { background: rgba(255,255,255,0.28); }
  button.danger { background: rgba(239, 68, 68, 0.3); }
  button.danger:hover { background: rgba(239, 68, 68, 0.55); }

  .collapsed .topics { display: none; }
  .chevron { transition: transform 0.2s; }
  .collapsed .chevron { transform: rotate(-90deg); }

  footer { text-align: center; margin-top: 30px; opacity: 0.7; font-size: 0.85em; }
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>🎓 My Study Progress Tracker</h1>
    <div class="subtitle">Click any topic to mark it complete. Progress saves automatically.</div>
  </header>

  <div class="stats-row">
    <div class="card">
      <div class="stats">
        <div class="stat"><div class="big" id="statDone">0</div><div class="label">Completed</div></div>
        <div class="stat"><div class="big" id="statTotal">0</div><div class="label">Total Topics</div></div>
        <div class="stat"><div class="big" id="statPct">0%</div><div class="label">Overall</div></div>
      </div>
      <div class="overall-bar-wrap">
        <div class="overall-bar" id="overallBar"></div>
        <div class="overall-bar-text" id="overallBarText">0 / 0 (0%)</div>
      </div>
    </div>
    <div class="card">
      <div class="chart-wrap"><canvas id="pieChart"></canvas></div>
    </div>
  </div>

  <div id="coursesRoot"></div>

  <div class="actions">
    <button onclick="exportData()">📥 Export JSON</button>
    <button onclick="document.getElementById('importFile').click()">📤 Import JSON</button>
    <input type="file" id="importFile" accept=".json" style="display:none" onchange="importData(event)"/>
    <button class="danger" onclick="resetAll()">🗑️ Reset All</button>
  </div>

  <footer>Data saved locally in your browser · <a href="https://github.com/Shubh3009/Tutorials" style="color:#93c5fd">GitHub Repo</a></footer>
</div>

<script>
const COURSES = [
  { n:1, name:"📘 Data Structures & Algorithms", topics:["Arrays","Strings","Linked Lists","Stacks","Queues","Recursion","Binary Search","Sorting","Hashing","Trees","Binary Search Trees","Heaps & Priority Queue","Graphs","Dynamic Programming","Tries & Advanced"] },
  { n:2, name:"📗 System Design", topics:["Fundamentals & Scaling","Load Balancing","Caching","Databases SQL vs NoSQL","Sharding & Replication","Message Queues","CAP Theorem","API Design","Microservices","Rate Limiting","Design URL Shortener","Design Twitter Feed","Design WhatsApp","Design YouTube","Design Uber"] },
  { n:3, name:"📙 Operating Systems", topics:["Intro & OS Types","Processes & Threads","CPU Scheduling","Synchronization","Deadlocks","Memory Management","Paging & Segmentation","Virtual Memory","File Systems","Disk Scheduling","I/O Systems","Security","Linux Internals","Shell & System Calls","Case Studies"] },
  { n:4, name:"📕 Computer Networks", topics:["OSI & TCP/IP","Physical Layer","Data Link Layer","MAC & Ethernet","IP & Subnetting","Routing","TCP vs UDP","Congestion Control","DNS","HTTP/HTTPS","TLS/SSL","Web Sockets","Firewalls & NAT","Wireless & Mobile","Network Security"] },
  { n:5, name:"📓 DBMS & SQL", topics:["DBMS Basics","Relational Model","SQL Basics","Joins","Aggregations","Subqueries","Window Functions","Indexes","Normalization","Transactions & ACID","Concurrency Control","Stored Procs & Triggers","NoSQL MongoDB","Query Optimization","Real-world SQL"] },
  { n:6, name:"📔 Python Programming", topics:["Syntax & Types","Control Flow","Functions & Lambdas","Comprehensions","OOP","Modules & Packages","File I/O","Exceptions","Decorators & Generators","Iterators","Multithreading & AsyncIO","NumPy & Pandas","Regex","Testing (pytest)","Mini Projects"] },
  { n:7, name:"📒 Web Development (MERN)", topics:["HTML5","CSS3 Flexbox/Grid","JavaScript ES6+","DOM & Events","React Basics","React Hooks","Redux","Next.js","Tailwind CSS","Node.js & Express","MongoDB","REST APIs","Auth (JWT)","Deployment","Full-Stack Project"] },
  { n:8, name:"📚 Machine Learning", topics:["Math for ML","Probability & Stats","Preprocessing","Linear Regression","Logistic Regression","Trees & Random Forest","SVM","KNN & Naive Bayes","K-Means","PCA","Neural Networks","CNNs","RNNs/LSTMs","Transformers & LLMs","End-to-End Project"] },
  { n:9, name:"☁️ Cloud & DevOps", topics:["Cloud Fundamentals","AWS EC2","AWS S3","AWS IAM","AWS RDS/DynamoDB","Lambda & API Gateway","VPC","CloudWatch","Docker Basics","Docker Compose","Kubernetes","GitHub Actions","Jenkins","Terraform","Deploy to AWS"] },
  { n:10, name:"🐧 Git, Linux & Shell", topics:["Git Basics","Branching & Merging","Rebasing","Fork/PR Workflow","Linux FS","File Permissions","Process Management","Package Managers","Networking Commands","Vim/Nano","Shell Basics","Variables & Loops","Awk/Sed/Grep","Cron Jobs","Real-world Scripts"] }
];

const KEY = "studyTrackerV1";
let state = load();
let pieChart;

function load() {
  try {
    const s = JSON.parse(localStorage.getItem(KEY));
    if (s && typeof s === "object") return s;
  } catch(e){}
  const fresh = {};
  COURSES.forEach(c => fresh[c.n] = new Array(c.topics.length).fill(false));
  return fresh;
}
function save() { localStorage.setItem(KEY, JSON.stringify(state)); }

function toggle(cn, idx) {
  state[cn][idx] = !state[cn][idx];
  save();
  render();
}

function totals() {
  let done = 0, total = 0;
  COURSES.forEach(c => {
    total += c.topics.length;
    done += state[c.n].filter(Boolean).length;
  });
  return { done, total, pct: total ? done/total*100 : 0 };
}

function render() {
  const t = totals();
  document.getElementById("statDone").textContent = t.done;
  document.getElementById("statTotal").textContent = t.total;
  document.getElementById("statPct").textContent = t.pct.toFixed(0) + "%";
  document.getElementById("overallBar").style.width = t.pct + "%";
  document.getElementById("overallBarText").textContent = `${t.done} / ${t.total} (${t.pct.toFixed(1)}%)`;

  const root = document.getElementById("coursesRoot");
  const openStates = {};
  root.querySelectorAll(".course").forEach(el => openStates[el.dataset.n] = !el.classList.contains("collapsed"));
  root.innerHTML = "";

  COURSES.forEach(c => {
    const done = state[c.n].filter(Boolean).length;
    const pct = done / c.topics.length * 100;
    const div = document.createElement("div");
    div.className = "course" + (openStates[c.n] === false ? " collapsed" : "");
    div.dataset.n = c.n;
    div.innerHTML = `
      <div class="course-head" onclick="this.parentElement.classList.toggle('collapsed')">
        <div><span class="chevron">▼</span> <span class="course-title">${c.name}</span></div>
        <div class="course-meta">
          <span>${done}/${c.topics.length}</span>
          <div class="mini-bar"><div class="mini-bar-fill" style="width:${pct}%"></div></div>
          <span class="course-pct">${pct.toFixed(0)}%</span>
        </div>
      </div>
      <div class="topics">
        ${c.topics.map((tp, i) => `
          <div class="cell ${state[c.n][i]?'done':''}" onclick="toggle(${c.n}, ${i})">
            <div class="check">${state[c.n][i]?'✓':''}</div>
            <div class="topic-name">${tp}</div>
          </div>
        `).join("")}
      </div>`;
    root.appendChild(div);
  });

  updateChart(t);
}

function updateChart(t) {
  const data = { labels:["Completed","Remaining"], datasets:[{ data:[t.done, t.total-t.done], backgroundColor:["#22c55e","rgba(255,255,255,0.15)"], borderColor:"rgba(255,255,255,0.3)", borderWidth:2 }] };
  if (!pieChart) {
    pieChart = new Chart(document.getElementById("pieChart"), {
      type:"doughnut", data,
      options:{ responsive:true, maintainAspectRatio:false, cutout:"60%",
        plugins:{ legend:{ position:"bottom", labels:{ color:"#eee", font:{size:13} } },
          title:{ display:true, text:"Overall Progress", color:"#eee", font:{size:16} } } }
    });
  } else {
    pieChart.data.datasets[0].data = [t.done, t.total-t.done];
    pieChart.update();
  }
}

function exportData() {
  const blob = new Blob([JSON.stringify(state, null, 2)], { type:"application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `study-progress-${new Date().toISOString().slice(0,10)}.json`;
  a.click();
}
function importData(e) {
  const f = e.target.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = ev => { try { state = JSON.parse(ev.target.result); save(); render(); alert("Imported ✅"); } catch { alert("Invalid file"); } };
  r.readAsText(f);
}
function resetAll() {
  if (!confirm("Reset all progress?")) return;
  localStorage.removeItem(KEY);
  state = load();
  render();
}

render();
</script>
</body>
</html>
